name: "🌐 Khashayar.one Downloader"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "🔗 Any Video/Media URL"
        required: true
        type: string
      quality:
        description: "📊 Quality (720=best, 480=medium, audio=MP3)"
        required: false
        type: choice
        default: "720"
        options:
          - "720"
          - "480"
          - audio
      media_type:
        description: "🎧 Media Type (video/audio/transcript)"
        required: false
        type: choice
        default: "video"
        options:
          - "video"
          - "audio"
          - "transcript"

env:
  PROJECT_NAME: "Khashayar Downloader"
  PROJECT_URL: "https://khashayar.one"
  TARGET_SIZE_MB: 40
  TARGET_SIZE_BYTES: 41943040
  MAX_PARTS: 30

jobs:
  download:
    name: "🌐 Download & Store"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: "⚙️ Configure Git"
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "🌐 Setup Cloudflare WARP"
        run: |
          docker network create warp-net 2>/dev/null || true
          docker run -d --name warp --restart=no --network warp-net \
            -p 1080:1080 --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp:latest
          echo "⏳ Waiting for WARP to be ready..."
          for i in {1..10}; do
            if curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP active"
              break
            fi
            sleep 5
          done

      - name: "📦 Install Dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg curl jq bc rar
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip3 install --quiet --upgrade "yt-dlp[default,curl-cffi]" "faster-whisper"

      - name: "🔧 Setup Parameters"
        id: setup
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_QUALITY: ${{ github.event.inputs.quality }}
          INPUT_MEDIA_TYPE: ${{ github.event.inputs.media_type }}
        run: |
          URL="${INPUT_URL}"
          QUALITY="${INPUT_QUALITY}"
          MEDIA_TYPE="${INPUT_MEDIA_TYPE}"

          # Normalize URLs
          if [[ "$URL" =~ youtube\.com/shorts/([a-zA-Z0-9_-]{11}) ]]; then
            URL="https://www.youtube.com/watch?v=${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ youtu\.be/([a-zA-Z0-9_-]{11}) ]]; then
            URL="https://www.youtube.com/watch?v=${BASH_REMATCH[1]}"
          elif [[ "$URL" =~ x\.com/ ]]; then
            URL="${URL/x.com/twitter.com}"
          fi

          case "${QUALITY}" in
            audio) FORMAT="bestaudio/bestaudio*/best" ;;
            720)   FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best" ;;
            480)   FORMAT="bestvideo[height<=480]+bestaudio/bestvideo[height<=480]*+bestaudio*/best" ;;
            *)     FORMAT="bestvideo+bestaudio/bestvideo*+bestaudio*/best" ;;
          esac

          # Save outputs for next steps
          echo "normalized_url=${URL}" >> $GITHUB_OUTPUT
          echo "quality=${QUALITY}" >> $GITHUB_OUTPUT
          echo "media_type=${MEDIA_TYPE}" >> $GITHUB_OUTPUT
          echo "format=${FORMAT}" >> $GITHUB_OUTPUT
          echo "tmp_dir=/tmp/dl_$(date +%s)_${RANDOM}" >> $GITHUB_OUTPUT

      - name: "🌐 Download, Split & Transcript"
        id: download
        env:
          URL: ${{ steps.setup.outputs.normalized_url }}
          FORMAT: ${{ steps.setup.outputs.format }}
          QUALITY: ${{ steps.setup.outputs.quality }}
          MEDIA_TYPE: ${{ steps.setup.outputs.media_type }}
          TMP_DIR: ${{ steps.setup.outputs.tmp_dir }}
          TARGET_SIZE_BYTES: ${{ env.TARGET_SIZE_BYTES }}
          TARGET_SIZE_MB: ${{ env.TARGET_SIZE_MB }}
          MAX_PARTS: ${{ env.MAX_PARTS }}
        run: |
          set -euo pipefail

          # Helper function to sanitize filenames
          sanitize_name() {
            local name="$1"
            name=$(echo "$name" | sed 's/[()（）]/_/g' | sed 's/[][{}\\/\\<>|:;'"'"'"]/_/g')
            name=$(echo "$name" | tr '[:space:]｜　' '-' | tr -c 'a-zA-Z0-9_-' '-' | tr -s '-' | sed 's/^-//;s/-$//')
            [ -z "$name" ] && name="unknown"
            echo "$name"
          }

          mkdir -p "$TMP_DIR" "${GITHUB_WORKSPACE}/downloads"

          # Expand URL
          echo "🌐 Resolving URL..."
          EXPANDED_URL=$(curl -Ls -o /dev/null -w '%{url_effective}' --max-redirs 10 --connect-timeout 10 "$URL" || echo "$URL")
          if [[ "$EXPANDED_URL" != */ ]]; then
            URL="$EXPANDED_URL"
          fi
          echo "🌐 Final URL: $URL"

          # Detect platform
          IS_YOUTUBE=false
          if [[ "$URL" =~ youtube\.com|youtu\.be|music\.youtube\.com ]]; then
            IS_YOUTUBE=true
          fi

          # Fetch metadata
          echo "🔍 Fetching metadata..."
          INFO_JSON=$(yt-dlp --proxy "socks5://127.0.0.1:1080" --dump-json --skip-download "$URL" 2>/dev/null || echo "{}")
          CREATOR=$(echo "$INFO_JSON" | jq -r '.uploader // .channel // .creator // .artist // "Unknown"')
          TITLE=$(echo "$INFO_JSON" | jq -r '.title // .description // "Untitled"')
          EXTRACTOR=$(echo "$INFO_JSON" | jq -r '.extractor_key // "generic"')
          DURATION=$(echo "$INFO_JSON" | jq -r '.duration // 0')
          VIEW_COUNT=$(echo "$INFO_JSON" | jq -r '.view_count // 0')
          THUMBNAIL_URL=$(echo "$INFO_JSON" | jq -r '.thumbnail // ""')

          EXTRACTOR_SLUG=$(sanitize_name "$EXTRACTOR")
          SAVE_DIR="${GITHUB_WORKSPACE}/downloads/${EXTRACTOR_SLUG}"
          mkdir -p "$SAVE_DIR" "${SAVE_DIR}/logs"

          # Build yt-dlp options
          YTDLP_OPTS=(
            "--format" "$FORMAT"
            "--no-cache-dir"
            "--no-part"
            "--retries" "30"
            "--fragment-retries" "30"
            "--socket-timeout" "60"
            "--concurrent-fragments" "8"
            "--merge-output-format" "mp4"
            "--output" "${TMP_DIR}/%(title)s.%(ext)s"
            "--impersonate" "chrome"
            "--no-check-certificates"
          )

          if [ "$IS_YOUTUBE" = true ]; then
            YTDLP_OPTS+=("--js-runtimes" "deno")
            YTDLP_OPTS+=("--extractor-args" "youtube:player_client=android,ios,web,mweb,tv")
          fi

          # Handle media type specific options
          MODE_OPTS=()
          case "$MEDIA_TYPE" in
            audio)
              echo "🎧 Mode: audio (MP3)"
              YTDLP_OPTS+=("--format" "bestaudio[abr<=192]/bestaudio[ext=m4a]/bestaudio/best")
              MODE_OPTS=("--extract-audio" "--audio-format" "mp3" "--audio-quality" "0")
              ;;
            transcript)
              echo "📝 Mode: transcript (low bitrate audio + Whisper)"
              YTDLP_OPTS+=("--format" "bestaudio[abr<=64]/bestaudio[ext=m4a]/bestaudio/best")
              MODE_OPTS=("--extract-audio" "--audio-format" "mp3" "--audio-quality" "5")
              ;;
            *)
              echo "🎬 Mode: video"
              ;;
          esac

          # Download with fallback
          echo "🌐 Starting download..."
          if ! yt-dlp --proxy "socks5://127.0.0.1:1080" "${YTDLP_OPTS[@]}" "${MODE_OPTS[@]}" "$URL" 2>"${SAVE_DIR}/logs/yt_error.log"; then
            echo "⚠️ WARP failed, retrying without proxy..."
            yt-dlp "${YTDLP_OPTS[@]}" "${MODE_OPTS[@]}" "$URL" 2>"${SAVE_DIR}/logs/yt_error_direct.log"
          fi

          # Process downloaded files
          declare -a FILE_NAMES FILE_PATHS FILE_SIZES SPLIT_FLAGS
          declare -a PART_NUMS TOTAL_PARTS_VALS ORIG_NAMES TRANSCRIPT_FLAGS
          TOTAL_FILES=0
          AUDIO_FOR_TRANSCRIPT=""

          for MEDIA_FILE in "$TMP_DIR"/*; do
            [ -f "$MEDIA_FILE" ] || continue

            BASENAME=$(basename "$MEDIA_FILE")
            SAFE_NAME=$(sanitize_name "${BASENAME%.*}")
            EXT="${BASENAME##*.}"
            FILE_SIZE=$(stat -c%s "$MEDIA_FILE")

            if [ "$MEDIA_TYPE" = "transcript" ]; then
              AUDIO_FOR_TRANSCRIPT="$MEDIA_FILE"
              continue
            fi

            if [ "$FILE_SIZE" -le "$TARGET_SIZE_BYTES" ]; then
              # Single file
              cp "$MEDIA_FILE" "${SAVE_DIR}/${SAFE_NAME}.${EXT}"
              FILE_NAMES+=("${SAFE_NAME}.${EXT}")
              FILE_PATHS+=("downloads/${EXTRACTOR_SLUG}/${SAFE_NAME}.${EXT}")
              FILE_SIZES+=("$FILE_SIZE")
              SPLIT_FLAGS+=("false")
              TOTAL_FILES=$((TOTAL_FILES + 1))
            else
              # Split with RAR
              echo "💾 Splitting ${SAFE_NAME}.${EXT} (${FILE_SIZE} bytes)..."
              SPLIT_DIR="/tmp/rar_split_$$"
              mkdir -p "$SPLIT_DIR"
              cp "$MEDIA_FILE" "${SPLIT_DIR}/${SAFE_NAME}.${EXT}"
              cd "$SPLIT_DIR"
              rar a -v${TARGET_SIZE_MB}m -ep1 -m0 -idq "${SAFE_NAME}.part.rar" "${SAFE_NAME}.${EXT}"
              rm -f "${SAFE_NAME}.${EXT}"
              cd - >/dev/null

              PART_FILES=($(ls "${SPLIT_DIR}/${SAFE_NAME}.part"*.rar 2>/dev/null | sort))
              TOTAL_PARTS=${#PART_FILES[@]}

              if [ "$TOTAL_PARTS" -le "$MAX_PARTS" ]; then
                for idx in "${!PART_FILES[@]}"; do
                  PART_NUM=$((idx + 1))
                  TARGET_NAME="${SAFE_NAME}.part${PART_NUM}.rar"
                  cp "${PART_FILES[$idx]}" "${SAVE_DIR}/${TARGET_NAME}"
                  FILE_NAMES+=("$TARGET_NAME")
                  FILE_PATHS+=("downloads/${EXTRACTOR_SLUG}/${TARGET_NAME}")
                  FILE_SIZES+=("$(stat -c%s "${SAVE_DIR}/${TARGET_NAME}")")
                  SPLIT_FLAGS+=("true")
                  PART_NUMS+=("$PART_NUM")
                  TOTAL_PARTS_VALS+=("$TOTAL_PARTS")
                  ORIG_NAMES+=("${SAFE_NAME}.${EXT}")
                  TOTAL_FILES=$((TOTAL_FILES + 1))
                done
              else
                echo "⚠️ Too many parts ($TOTAL_PARTS > $MAX_PARTS), skipping split"
              fi
              rm -rf "$SPLIT_DIR"
            fi
          done

          # Whisper transcription
          if [ "$MEDIA_TYPE" = "transcript" ] && [ -n "$AUDIO_FOR_TRANSCRIPT" ] && [ -f "$AUDIO_FOR_TRANSCRIPT" ]; then
            echo "🎧 Generating transcript with Whisper..."
            TRANSCRIPT_FILE="${TMP_DIR}/transcript.txt"
            python3 - <<PYTHON
from faster_whisper import WhisperModel
import os

audio = "$AUDIO_FOR_TRANSCRIPT"
model = WhisperModel("base", device="cpu", compute_type="int8", cpu_threads=2)
segments, _ = model.transcribe(audio, beam_size=5)

with open("$TRANSCRIPT_FILE", "w", encoding="utf-8") as f:
    for seg in segments:
        text = seg.text.strip()
        if text:
            ts = f"[{int(seg.start//60):02d}:{int(seg.start%60):02d}]"
            f.write(f"{ts} {text}\n")
            if text.endswith(('.', '!', '?')):
                f.write("\n")
print("✅ Transcript generated")
PYTHON

            if [ -f "$TRANSCRIPT_FILE" ]; then
              SAFE_TNAME=$(sanitize_name "${TITLE}_transcript")
              cp "$TRANSCRIPT_FILE" "${SAVE_DIR}/${SAFE_TNAME}.txt"
              FILE_NAMES+=("${SAFE_TNAME}.txt")
              FILE_PATHS+=("downloads/${EXTRACTOR_SLUG}/${SAFE_TNAME}.txt")
              FILE_SIZES+=("$(stat -c%s "${SAVE_DIR}/${SAFE_TNAME}.txt")")
              SPLIT_FLAGS+=("false")
              TRANSCRIPT_FLAGS+=("true")
              TOTAL_FILES=$((TOTAL_FILES + 1))
            fi
          fi

          # Cleanup
          rm -rf "$TMP_DIR"

          # Save all outputs for next steps
          {
            echo "download_success=true"
            echo "total_files=${TOTAL_FILES}"
            echo "extractor_slug=${EXTRACTOR_SLUG}"
            echo "creator=${CREATOR}"
            echo "title=${TITLE}"
            echo "extractor=${EXTRACTOR}"
            echo "duration=${DURATION}"
            echo "view_count=${VIEW_COUNT}"
            echo "thumbnail_url=${THUMBNAIL_URL}"
            
            # Serialize arrays (max 50 files)
            for i in "${!FILE_NAMES[@]}"; do
              echo "file_${i}_name=${FILE_NAMES[$i]}"
              echo "file_${i}_path=${FILE_PATHS[$i]}"
              echo "file_${i}_size=${FILE_SIZES[$i]}"
              echo "file_${i}_split=${SPLIT_FLAGS[$i]}"
              if [ "${SPLIT_FLAGS[$i]}" = "true" ]; then
                echo "file_${i}_part=${PART_NUMS[$i]}"
                echo "file_${i}_total_parts=${TOTAL_PARTS_VALS[$i]}"
                echo "file_${i}_original_name=${ORIG_NAMES[$i]}"
              fi
              if [ "${TRANSCRIPT_FLAGS[$i]:-false}" = "true" ]; then
                echo "file_${i}_is_transcript=true"
              fi
            done
          } >> $GITHUB_OUTPUT

      - name: "📤 Commit Downloads to Repository"
        if: steps.download.outputs.download_success == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"
          git add downloads/
          if git diff --staged --quiet; then
            echo "🟢 No changes to commit"
          else
            git commit -m "feat: add ${{ steps.download.outputs.title }} [${{ steps.download.outputs.extractor }}]"
            git pull --rebase origin main --quiet || true
            git push origin main --force-with-lease --quiet
            echo "✅ Pushed to repository"
          fi

      - name: "📋 Generate Output JSON for Bot"
        id: output_json
        if: steps.download.outputs.download_success == 'true'
        run: |
          TOTAL=${{ steps.download.outputs.total_files }}
          FILES_JSON="["
          
          for i in $(seq 0 $((TOTAL - 1))); do
            if [ $i -gt 0 ]; then
              FILES_JSON+=","
            fi
            
            NAME_VAR="file_${i}_name"
            PATH_VAR="file_${i}_path"
            SIZE_VAR="file_${i}_size"
            SPLIT_VAR="file_${i}_split"
            PART_VAR="file_${i}_part"
            TOTAL_PARTS_VAR="file_${i}_total_parts"
            ORIG_VAR="file_${i}_original_name"
            TRANS_VAR="file_${i}_is_transcript"
            
            FILES_JSON+="{\"name\":\"${!NAME_VAR}\",\"path\":\"${!PATH_VAR}\",\"size\":${!SIZE_VAR},\"split\":${!SPLIT_VAR:-false}"
            
            if [ "${!PART_VAR:-}" != "" ]; then
              FILES_JSON+=",\"part\":${!PART_VAR},\"total_parts\":${!TOTAL_PARTS_VAR},\"original_name\":\"${!ORIG_VAR}\""
            fi
            
            if [ "${!TRANS_VAR:-false}" = "true" ]; then
              FILES_JSON+=",\"is_transcript\":true"
            fi
            
            FILES_JSON+="}"
          done
          FILES_JSON+="]"
          
          echo "json_output=${FILES_JSON}" >> $GITHUB_OUTPUT
          
          echo "════════════════════════════════════════"
          echo "  📋 OUTPUT SUMMARY"
          echo "════════════════════════════════════════"
          echo "  🏷 Extractor: ${{ steps.download.outputs.extractor }}"
          echo "  👤 Creator:   ${{ steps.download.outputs.creator }}"
          echo "  📝 Title:     ${{ steps.download.outputs.title }}"
          echo "  ⏱ Duration:  ${{ steps.download.outputs.duration }}s"
          echo "  📦 Files:     ${{ steps.download.outputs.total_files }}"
          echo "════════════════════════════════════════"

      - name: "🛑 Stop WARP"
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true
